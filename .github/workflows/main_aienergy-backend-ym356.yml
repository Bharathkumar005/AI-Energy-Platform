# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - aienergy-backend-ym356

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to container registry
        uses: docker/login-action@v2
        with:
          registry: aienergyacrym356.azurecr.io/
          username: ${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_19CA08855CA44E3DB7DEF89192370311 }}
          password: ${{ secrets.AZUREAPPSERVICE_CONTAINERPASSWORD_024066D242654FE1A20BBBF50E89B99D }}

      - name: Build and push container image to registry
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: aienergyacrym356.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_19CA08855CA44E3DB7DEF89192370311 }}/ai-energy-backend:${{ github.sha }}
          file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    needs: build
    
    steps:
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_A1A48488C3DF48418BF64AB9F9194B7C }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_37AFE80B32804E9FBC25F1C5EE6C97FB }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_0FDE9674BBFF4E83AF9647B8220A076C }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'aienergy-backend-ym356'
          slot-name: 'Production'
          images: 'aienergyacrym356.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_19CA08855CA44E3DB7DEF89192370311 }}/ai-energy-backend:${{ github.sha }}'
          